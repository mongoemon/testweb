# E2E Gate — runs the Playwright suite against the code in THIS pull request.
#
# Why this file lives in the app repo, not in testweb-e2e:
#   testweb-e2e/.github/workflows/playwright.yml is a MONITOR. It runs against a
#   deployed Render environment, so it can only report on code that already
#   shipped. This workflow is a GATE. It builds the app from the PR's own commit,
#   starts it on localhost, and points the same suite at it — so a change that
#   breaks a data-testid fails the PR instead of failing after merge.
#
# Both repos are public, so checking out the E2E suite needs no extra token.

name: E2E Gate

on:
  pull_request:
    branches: [main, staging, qa]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests matching this pattern (blank = all)'
        required: false
        type: string

# A new push to the same branch cancels the run still in flight.
concurrency:
  group: e2e-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  E2E_REPO: mongoemon/testweb-e2e
  E2E_REF: main
  APP_PORT: '8000'

jobs:
  e2e-gate:
    name: Playwright vs PR build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── check out both sides ───────────────────────────────────────────────
      - name: Checkout app (this PR)
        uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout E2E suite
        uses: actions/checkout@v4
        with:
          repository: ${{ env.E2E_REPO }}
          ref: ${{ env.E2E_REF }}
          path: e2e

      # ── build and start the app from the PR's own code ─────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/backend/requirements.txt

      - name: Install backend dependencies
        working-directory: app/backend
        run: pip install -r requirements.txt

      - name: Start app
        working-directory: app/backend
        env:
          # ENVIRONMENT=qa turns AUTO_SEED on, so the app seeds its own test
          # accounts and products at startup. See backend/config.py.
          ENVIRONMENT: qa
          DEBUG: 'false'
          # Fresh database every run — never reuse a committed shop.db.
          DATABASE_URL: ${{ runner.temp }}/ci-shop.db
          SECRET_KEY: ci-only-not-a-real-secret
          CORS_ORIGINS: '*'
        run: |
          uvicorn main:app --host 127.0.0.1 --port "$APP_PORT" --log-level warning \
            > "$RUNNER_TEMP/app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/app.pid"

      - name: Wait for app to be ready
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "http://127.0.0.1:$APP_PORT/api/products" || echo 000)
            if [ "$code" = "200" ]; then
              echo "App ready after ${i}s."
              exit 0
            fi
            sleep 1
          done
          echo "App never returned 200. Last 100 log lines:"
          tail -n 100 "$RUNNER_TEMP/app.log"
          exit 1

      # ── run the suite against it ───────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Run Playwright
        working-directory: e2e
        env:
          BASE_URL: http://127.0.0.1:${{ env.APP_PORT }}
          GREP: ${{ inputs.grep }}
        run: |
          if [ -n "$GREP" ]; then
            npx playwright test --reporter=github,html --grep "$GREP"
          else
            npx playwright test --reporter=github,html
          fi

      # ── evidence ───────────────────────────────────────────────────────────
      - name: App log (on failure)
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/app.log"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-gate-report-${{ github.run_number }}
          path: e2e/playwright-report/
          retention-days: 14

      - name: Stop app
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/app.pid")" 2>/dev/null || true
